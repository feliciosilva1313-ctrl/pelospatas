<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login e Cadastro</title>
    <link rel="stylesheet" href="../pelos/form1.css">
</head>
<body>

    <main class="container">

        <aside class="lateral">
            <img src="../pelos/85870f5bbe61185082024d5c0ed96804.jpg" alt="img">
        </aside>

        <section class="conteudo">

            <div class="formulario">

                <div class="abas">
                    <button type="button" id="abaLogin" class="ativa" onclick="mostrarLogin()">Login</button>
                    <button type="button" id="abaCadastro" onclick="mostrarCadastro()">Cadastro</button>
                </div>

                <!-- LOGIN -->
                <form id="formLogin" onsubmit="entrar(event)">
                    <h2>Bem-vindo de volta</h2>
                    <p>Entre na sua conta</p>

                    <input type="email" id="loginEmail" placeholder="Seu e-mail" required>
                    <input type="password" id="loginSenha" placeholder="Sua senha" required>

                    <p class="erro" id="erroLogin"></p>

                    <button type="submit" class="botao">Entrar</button>

                    <span>Não tem uma conta? <a href="#" onclick="mostrarCadastro(); return false;">Cadastre-se</a></span>
                </form>

                <!-- CADASTRO -->
                <form id="formCadastro" class="escondido" onsubmit="cadastrar(event)">
                    <h2>Crie sua conta</h2>
                    <p>Preencha seus dados para começar</p>

                    <input type="text" id="cadNome" placeholder="Seu nome" required>
                    <input type="email" id="cadEmail" placeholder="Seu e-mail" required>
                    <input type="tel" id="cadTelefone" placeholder="Telefone (ex: (31) 99999-9999)" required>
                    <input type="text" id="cadCidade" placeholder="Cidade (ex: Contagem - MG)" required>

                    <label class="label-foto" for="cadFoto">Foto de perfil (opcional)</label>
                    <input type="file" id="cadFoto" accept="image/*">

                    <input type="password" id="cadSenha" placeholder="Sua senha" required>
                    <input type="password" id="cadConfirmar" placeholder="Confirme sua senha" required>

                    <p class="erro" id="erroCadastro"></p>

                    <button type="submit" class="botao">Cadastrar</button>

                    <span>Já tem uma conta? <a href="#" onclick="mostrarLogin(); return false;">Entrar</a></span>
                </form>

            </div>

        </section>

    </main>

    <script src="../pelos/form1.js"></script>
</body>
</html>
